# Коробка Sentra: docker compose up -d --build
services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.106.1
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=90d
      - -httpListenAddr=:8428
    volumes:
      - vm-data:/storage
    restart: unless-stopped
    # порт наружу не публикуем: доступ только у сервера Sentra

  sentra:
    build: .
    image: sentra:0.1.0
    depends_on:
      - victoriametrics
    ports:
      - "443:8443"
    environment:
      # адрес, по которому агенты и браузер видят коробку (иначе берётся из адресной строки)
      SENTRA_PUBLIC_URL: ${SENTRA_PUBLIC_URL:-}
      # IP/имена в сертификате, через запятую
      SENTRA_CERT_HOSTS: ${SENTRA_CERT_HOSTS:-}
      SENTRA_ADMIN_PASSWORD: ${SENTRA_ADMIN_PASSWORD:-}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - sentra-data:/var/lib/sentra
    restart: unless-stopped

volumes:
  vm-data:
  sentra-data:
